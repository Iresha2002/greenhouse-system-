name: SmartGrow OS QA & CI/CD Pipeline (EC4206)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-qa-tests:
    name: Backend Unit, BDD & API Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SmartGrow OS Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run TDD Unit Tests (12 Tests)
        working-directory: ./backend
        run: npm test

      - name: Run Cucumber Gherkin BDD Tests (2 Scenarios, 7 Steps)
        working-directory: ./backend
        run: npm run test:bdd

      - name: Run Automated REST API Integration Tests (6 Endpoints)
        working-directory: ./backend
        run: npm run test:api

  frontend-build-verification:
    name: Frontend Vite Production Build Check
    runs-on: ubuntu-latest
    needs: backend-qa-tests

    steps:
      - name: Checkout SmartGrow OS Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify Frontend Production Build
        working-directory: ./frontend
        run: npm run build
